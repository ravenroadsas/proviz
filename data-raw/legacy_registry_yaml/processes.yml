# Process registry: the source of truth for the "coverage" KPI and the
# overview tab's process list. One entry per target business process --
# instrumented or not. Add a row here as soon as a process is *scoped*
# (Step 1 of the playbook), not only once it's instrumented; that's what
# makes coverage a meaningful fraction instead of a tautological 100%.
#
# status: not_started | designed | instrumented | deprecated
#   not_started  -- identified as in-scope, nothing designed yet
#   designed     -- ideal process modeled (activities + variants below),
#                   no app instrumented yet
#   instrumented -- protrace wired into at least one subprocess/app;
#                   dashboard will compute live KPIs for these
#   deprecated   -- retired; kept for history, excluded from coverage's
#                   denominator
#
# loop_length: short | medium | long -- how immediate the process's
# outcome and the data behind it are, not how long the process itself
# takes to run. Daily production surveillance is short-loop (decision and
# feedback within a day or two); type curve construction is medium-loop
# (a curve's real quality shows up over weeks/months of new well data);
# reserves estimation would be long-loop (the outcome plays out over years).
#
# subprocesses: app/module(s) this process spans, grouped into ordered
# **steps** (the business process's own flow -- see pv_step_sequence()):
# `step`/`step_order` group one or more apps into the same ordered step
# (`step_label` defaults to a prettified `step` if omitted); `app_order`
# positions an app within its step (defaults to declaration order). Each
# app declares its own `ideal_process` (path, relative to this file's
# directory, to the activities+variants+outcomes YAML
# pv_load_ideal_process() reads -- see that file's `outcomes` block for
# how the app's own activity ends, e.g. a deliverable or a named decision)
# -- there is no process-level `ideal_process` field anymore.
# `app`/`subprocess`/`step`/`step_order` can be declared as soon as
# they're scoped (Step 2-3 of the playbook, before any instrumentation
# exists); `duckdb_path` is required only once status == instrumented,
# naming the local DuckDB file pv_connect_registry() will ATTACH.
#
# step_variants: optional -- a list of acceptable step-slug sequences for
# a business process whose real flow branches or loops back to an
# earlier step (see pv_step_sequence()). Omit it and the process's
# business-level "ideal flow" is just its steps in step_order, a single
# straight-through sequence.
#
# adoption_source: optional, path (relative to this file's directory) to
# the yearly training/satisfaction workbook pv_load_adoption() reads --
# one sheet per app (see that function's docs for the expected columns).
# Only needs declaring on one process entry; it describes the whole
# portfolio.
#
# adoption_threshold: optional, per app -- the weekly engagement score
# (see each app's own ideal_process activities' `score` field) an
# identified user must average to count as "actively using" that app,
# for the IGA adoption index's usage component (see pv_app_iga()).

- process_id: type_curve_construction
  macroprocess: reservoir_engineering
  process: "Type Curve Construction"
  owner: "Reservoir Engineering Lead"
  status: instrumented
  loop_length: medium
  adoption_source: adoption.xlsx
  step_variants:
    - [draft, review] # straight-through: approved on the first pass
    - [draft, review, draft, review] # one rework loop: rejected, redrafted, re-reviewed
  subprocesses:
    - app: typecurves
      subprocess: type_curve_module
      step: draft
      step_label: "Draft"
      step_order: 1
      ideal_process: ../../inst/registry/ideal_processes/type_curve_draft.yml
      duckdb_path: /mnt/shared/apps/typecurves/protrace.duckdb
      adoption_threshold: 10
    - app: typecurve_review
      subprocess: type_curve_review_module
      step: review
      step_label: "Review & Publish"
      step_order: 2
      ideal_process: ../../inst/registry/ideal_processes/type_curve_review.yml
      duckdb_path: /mnt/shared/apps/typecurve_review/protrace.duckdb
      adoption_threshold: 8

- process_id: daily_production_surveillance
  macroprocess: production_operations
  process: "Daily Production Surveillance"
  owner: "Production Engineering Lead"
  status: designed
  loop_length: short
  subprocesses:
    - app: surveillance
      subprocess: surveillance_app
      step: surveillance
      step_label: "Surveillance"
      step_order: 1
      ideal_process: ../../inst/registry/ideal_processes/daily_production_surveillance.yml
      adoption_threshold: 6
