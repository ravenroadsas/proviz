process_id: daily_production_surveillance
activities:
- id: Data_Ingestion
  label: Pull SCADA & Historian Data
  role: Surveillance Analyst
- id: Data_Quality_Check
  label: Validate & Cleanse Meter Readings
  role: Surveillance Analyst
- id: Production_Allocation
  label: Reconcile Well-to-Facility Allocation
  role: Production Engineer
- id: Variance_Analysis
  label: Compare Actual vs Forecast/Nomination
  role: Production Engineer
- id: Well_Anomaly_Screening
  label: Screen Wells for Anomalies
  role: Production Engineer
- id: Artificial_Lift_Review
  label: Review Artificial Lift Performance
  role: Reliability Engineer
- id: Exception_Prioritization
  label: Prioritize Flagged Deviations
  role: Production Engineer
- id: Root_Cause_Diagnostics
  label: Diagnose Root Cause on Flagged Wells
  role: Reliability Engineer
- id: Forecast_Update
  label: Update Production Forecast / Decline Curve
  role: Production Engineer
- id: Surveillance_Reporting
  label: Log Findings in Daily Surveillance Report
  role: Surveillance Analyst
- id: Issue_Escalation
  label: Escalate Critical Issue to Ops/Engineering
  role: Shift Supervisor
- id: Report_Signoff
  label: Review & Sign Off Daily Report
  role: Shift Supervisor
